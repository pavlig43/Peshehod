services:
  postgres:
    image: postgres:18-alpine
    container_name: peshehod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peshehod}
      POSTGRES_USER: ${POSTGRES_USER:-peshehod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peshehod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - peshehod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peshehod-postgres-data:
